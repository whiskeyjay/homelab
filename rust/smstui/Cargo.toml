[package]
name = "smstui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
log = { version = "0.4", features = [
    "max_level_trace",
    "release_max_level_debug",
] }
log4rs = { version = "1.3", features = ["rolling_file_appender"] }
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["full"] }
unicode-width = "0.2"
